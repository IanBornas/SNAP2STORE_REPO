services:
  - type: web
    name: ai-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: FLASK_DEBUG
        value: false
      - key: PORT
        value: 5000
      # Add your Google API credentials as needed:
      # - key: GOOGLE_VISION_API_KEY
      #   sync: false
      # - key: GOOGLE_MAPS_API_KEY
      #   sync: false
      # - key: GOOGLE_APPLICATION_CREDENTIALS
      #   value: /opt/render/vision_sa.json
    healthCheckPath: /warmup